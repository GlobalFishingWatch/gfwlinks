name: live

# Separate from `test`: this one talks to the live GFW app, so a failure can mean
# the frontend changed its URL contract *or* that the app is simply down. Keeping
# it out of the PR gate means neither blocks an unrelated merge.
on:
  schedule:
    - cron: "34 6 * * 1"     
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9
      - run: uv run --group live playwright install --with-deps chromium
        working-directory: python
      - run: uv run --group live pytest tests/test_live.py -v
        working-directory: python
        env:
          GFWLINKS_LIVE: "1"
      - name: Embed screenshots in job summary
        if: always()         # screenshots are taken every run, pass or fail
        run: |
          shopt -s nullglob
          for f in python/live-screenshots/*; do
            echo "### $(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
            echo "![$(basename "$f")](data:image/jpeg;base64,$(base64 -w0 "$f"))" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v7
        if: always()         # full-res fallback / download for offline review
        with:
          name: live-screenshots
          path: python/live-screenshots/
