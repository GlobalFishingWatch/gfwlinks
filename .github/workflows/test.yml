name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          py=$(grep -m1 '^version' python/pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          r=$(grep -m1 '^Version:' r/DESCRIPTION | sed -E 's/Version: //')
          echo "python=$py  r=$r"
          [ "$py" = "$r" ] || { echo "::error::version mismatch: python=$py r=$r"; exit 1; }

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv run --python ${{ matrix.python-version }} pytest
        working-directory: python

  r:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        r-version: ["release", "4.1.0"]   # 4.1.0 is the floor declared in r/DESCRIPTION's Depends
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r-version }}
      - run: Rscript -e 'install.packages(c("testthat", "jsonlite"))'
      - run: Rscript -e 'testthat::test_dir("tests/testthat")'
        working-directory: r

  r-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          extra-packages: any::rcmdcheck
      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: r
